name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, types (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Offline tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -m "not network"

      - name: Lint
        run: python -m ruff check src tests examples scripts

      - name: Type check
        run: python -m mypy src tests examples scripts

      - name: Offline demos
        env:
          MPLBACKEND: Agg
        run: |
          python examples/synthetic_pipeline.py
          python examples/strategy_baseline.py
          python examples/evaluate_lap_time_model.py
